<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-tac-toe</title>
</head>
<body>
    <h1>Tic-tac-toe Game</h1>
    <div id="gameBoard" style="display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 5px;">
        <div class="cell" data-index="0" style="width: 100px; height: 100px; border: 1px solid black; display: flex; align-items: center; justify-content: center; font-size: 48px; cursor: pointer;"></div>
        <div class="cell" data-index="1" style="width: 100px; height: 100px; border: 1px solid black; display: flex; align-items: center; justify-content: center; font-size: 48px; cursor: pointer;"></div>
        <div class="cell" data-index="2" style="width: 100px; height: 100px; border: 1px solid black; display: flex; align-items: center; justify-content: center; font-size: 48px; cursor: pointer;"></div>
        <div class="cell" data-index="3" style="width: 100px; height: 100px; border: 1px solid black; display: flex; align-items: center; justify-content: center; font-size: 48px; cursor: pointer;"></div>
        <div class="cell" data-index="4" style="width: 100px; height: 100px; border: 1px solid black; display: flex; align-items: center; justify-content: center; font-size: 48px; cursor: pointer;"></div>
        <div class="cell" data-index="5" style="width: 100px; height: 100px; border: 1px solid black; display: flex; align-items: center; justify-content: center; font-size: 48px; cursor: pointer;"></div>
        <div class="cell" data-index="6" style="width: 100px; height: 100px; border: 1px solid black; display: flex; align-items: center; justify-content: center; font-size: 48px; cursor: pointer;"></div>
        <div class="cell" data-index="7" style="width: 100px; height: 100px; border: 1px solid black; display: flex; align-items: center; justify-content: center; font-size: 48px; cursor: pointer;"></div>
        <div class="cell" data-index="8" style="width: 100px; height: 100px; border: 1px solid black; display: flex; align-items: center; justify-content: center; font-size: 48px; cursor: pointer;"></div>
    </div>
    <script>
        const cells = document.querySelectorAll('.cell');
        let currentPlayer = 'X';
        let gameState = ['', '', '', '', '', '', '', '', ''];
        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function handleCellClick(event) {
            const index = event.target.getAttribute('data-index');
            if (gameState[index] !== '' || checkWin()) {
                return;
            }
            gameState[index] = currentPlayer;
            event.target.textContent = currentPlayer;
            if (checkWin()) {
                alert(`${currentPlayer} wins!`);
                resetGame();
                return;
            }
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        }

        function checkWin() {
            for (let condition of winningConditions) {
                const [a, b, c] = condition;
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    return true;
                }
            }
            return false;
        }

        function resetGame() {
            if (checkWin() || gameState.every(cell => cell !== '')) {
                gameState = ['', '', '', '', '', '', '', '', ''];
                currentPlayer = 'X';
                cells.forEach(cell => cell.textContent = '');
            }
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick)); 
    </script>

</body>
</html>
